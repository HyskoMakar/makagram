{% extends 'base.html' %}
{% block title %}# {{ room_name }}{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-xl shadow overflow-hidden">
        <div class="px-4 py-3 border-b flex justify-between items-center">
            <span class="font-semibold text-gray-700"># {{ room_name }}</span>
            <span class="text-sm text-green-500"><span id="online-count">0</span> online</span>
        </div>
        <div id="chat-log" class="flex flex-col gap-2 p-4 h-96 overflow-y-auto"></div>
        <div class="px-4 py-3 border-t flex gap-2">
            <input id="chat-message-input" type="text"
                class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400"
                placeholder="Write something...">
            <button id="chat-message-submit"
                class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-lg text-sm">
                Send
            </button>
        </div>
    </div>
</div>

{{ room_name|json_script:"room-name" }}
<script>
    const roomName = JSON.parse(document.getElementById('room-name').textContent);

    const wsScheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const chatSocket = new WebSocket(
        wsScheme + '://' + window.location.host + '/ws/lobby/' + roomName + '/'
    );

    window.addEventListener('beforeunload', () => chatSocket.close());

    chatSocket.onmessage = function(e) {
        const data = JSON.parse(e.data);

        if (data.type === 'online_count') {
            document.getElementById('online-count').textContent = data.count;
            return;
        }

        const log = document.querySelector('#chat-log');
        const msg = document.createElement('div');
        msg.className = 'bg-gray-100 rounded-lg px-3 py-2 text-sm text-gray-800 self-start max-w-xs';
        msg.innerHTML = '<span class="text-' + data.user.color + '-600">' + data.user.username + '</span></br> ' + data.message;
        log.appendChild(msg);
        log.scrollTop = log.scrollHeight;
    };

    chatSocket.onclose = function(e) {
        console.error('Chat socket closed unexpectedly');
    };

    document.querySelector('#chat-message-input').focus();
    document.querySelector('#chat-message-input').onkeyup = function(e) {
        if (e.key === 'Enter') document.querySelector('#chat-message-submit').click();
    };

    document.querySelector('#chat-message-submit').onclick = function(e) {
        const input = document.querySelector('#chat-message-input');
        if (input.value != '') {
            chatSocket.send(JSON.stringify({ 'message': input.value }));
            input.value = '';
        }
    };
</script>
{% endblock %}
