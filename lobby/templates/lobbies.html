{% extends 'base.html' %}
{% block title %}Lobbies{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-4">
        <h1 class="text-2xl font-semibold text-gray-800">Lobbies</h1>
        <p class="text-xs text-gray-500 mt-0.5">Public real-time chat rooms</p>
    </div>

    <div class="grid gap-3">
        {% for room in rooms %}
        <a href="{% url 'room' room.name %}" class="bg-white rounded-xl shadow-sm border border-gray-100 px-5 py-4 flex justify-between items-center hover:shadow-md transition-all">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-semibold flex-shrink-0 bg-blue-400 text-sm select-none shadow-sm">
                    #
                </div>
                <div>
                    <div class="font-semibold text-gray-900 hover:text-blue-600"># {{ room.name }}</div>
                    <div class="text-xs text-gray-400 mt-0.5">Public room</div>
                </div>
            </div>
            <span class="text-xs text-green-600 font-semibold px-2.5 py-0.5 bg-green-50 rounded-full border border-green-100">
                {{ room.online }} online
            </span>
        </a>
        {% empty %}
        <div class="bg-white rounded-xl shadow-sm border p-8 text-center text-gray-500 text-sm">
            No lobbies available.
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
