{% extends 'base.html' %}
{% block title %}Lobbies{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-xl font-semibold text-gray-700 mb-4">Lobbies</h1>
    <div class="flex flex-col gap-3">
        {% for room in rooms %}
        <a href="{% url 'room' room.name %}"
            class="bg-white rounded-xl shadow px-5 py-4 flex justify-between items-center hover:shadow-md">
            <span class="font-medium text-gray-700"># {{ room.name }}</span>
            <span class="text-sm text-green-500">{{ room.online }} online</span>
        </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
