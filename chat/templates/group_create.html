{% extends 'base.html' %}
{% block title %}Create Group{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <div class="mb-6">
            <h1 class="text-2xl font-semibold text-gray-800">Create Group</h1>
            <p class="text-xs text-gray-500 mt-0.5">Set up a new public or private group discussion</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" class="flex flex-col gap-5">
            {% csrf_token %}

            <div>
                <label class="text-sm font-medium text-gray-700 block mb-1">Group Name</label>
                <input type="text" name="name" required placeholder="My Awesome Group"
                       class="w-full border rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white">
            </div>

            <div>
                <label class="text-sm font-medium text-gray-700 block mb-2">Privacy Type</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="cursor-pointer">
                        <input type="radio" name="private" value="0" class="hidden peer" checked>
                        <div class="p-3.5 border rounded-xl flex flex-col gap-1 transition-all peer-checked:border-blue-500 peer-checked:bg-blue-50/50 peer-checked:ring-2 peer-checked:ring-blue-500/20 hover:border-gray-300">
                            <div class="font-semibold text-sm text-gray-800">
                                Public
                            </div>
                            <span class="text-xs text-gray-500">Anyone can see and join</span>
                        </div>
                    </label>

                    <label class="cursor-pointer">
                        <input type="radio" name="private" value="1" class="hidden peer">
                        <div class="p-3.5 border rounded-xl flex flex-col gap-1 transition-all peer-checked:border-blue-500 peer-checked:bg-blue-50/50 peer-checked:ring-2 peer-checked:ring-blue-500/20 hover:border-gray-300">
                            <div class="font-semibold text-sm text-gray-800">
                                Private
                            </div>
                            <span class="text-xs text-gray-500">Invite only in private chat</span>
                        </div>
                    </label>
                </div>
            </div>

            <div>
                <label class="text-sm font-medium text-gray-700 block mb-2">Group Color</label>
                <div class="flex flex-wrap gap-2">
                    {% for color in colors %}
                    <label class="cursor-pointer">
                        <input type="radio" name="color" value="{{ color }}" class="hidden peer"
                               {% if color == 'blue' %}checked{% endif %}>
                        <div class="w-8 h-8 rounded-full ring-2 ring-transparent peer-checked:ring-gray-800 peer-checked:ring-offset-2 bg-{{ color }}-400 shadow-sm"></div>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <div class="flex items-center gap-3 pt-4 border-t">
                <button type="submit" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white rounded-lg py-2.5 text-sm font-semibold shadow-sm transition-colors">
                    Create Group
                </button>
                <a href="{% url 'chats-list' %}" class="px-5 py-2.5 border rounded-lg text-sm text-gray-600 hover:bg-gray-50 transition-colors font-medium">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
