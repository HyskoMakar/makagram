<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style type="text/tailwindcss">
        * {
            @apply transition ease-in-out
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="sticky top-0 z-50 w-full bg-white border-b">
        <div class="mx-auto flex h-16 max-w-7xl items-center gap-8 px-4">
            <a href="" class="font-medium text-xl">MaKaGram</a>
            <nav class="items-center gap-4">
                <a class="text-sm font-medium text-gray-600 transition-colors hover:text-gray-900" href="{% url 'room-index' %}">Rooms</a>
            </nav>
            <div>
                
            </div>
        </div>
    </header>
    <div class="container mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
