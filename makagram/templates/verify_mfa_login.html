{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16">
    <div class="bg-white rounded-xl shadow p-6">
        <h2 class="text-xl font-semibold mb-4">2FA Login</h2>
        <form method="post" class="flex flex-col gap-3">
            {% csrf_token %}
            <label class="text-sm text-gray-600">Open your <b>authenticator</b> app and enter code here:</label>
            <input type="text" name="otp_code" placeholder="123456" autofocus maxlength="6" required autocomplete="off" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 mt-1">
            <button type="submit"
                class="bg-blue-500 hover:bg-blue-600 text-white rounded-lg py-2 text-sm">Login</button>
        </form>
    </div>
</div>
{% endblock %}
