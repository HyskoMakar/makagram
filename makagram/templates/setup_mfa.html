{% extends 'base.html' %}
{% block title %}Profile{% endblock %}
{% block content %}

<div class="max-w-md mx-auto">
    <div class="bg-white rounded-xl shadow p-6">
        <img src="{% url 'generate_qr_code' %}" alt="QR Code" class="rounded-xl">
        
        <form method="POST" action="{% url 'verify_mfa' %}" class="flex flex-col gap-4 pt-4">
            {% csrf_token %}
            <div>
                <p>Enter code from your <strong>authenticator</strong> app:</p>
                <input type="text" name="otp_code" required maxlength="6" placeholder="123456"
                class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400 mt-1">
            </div>
            <button type="submit" class="bg-slate-500 hover:bg-slate-600 text-white rounded-lg py-2 text-sm">
                Activate
            </button>
        </form>
    </div>
</div>

{% endblock %}
