<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { transition: all 150ms ease-in-out; }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(107, 114, 128, 0.7);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="sticky top-0 z-50 w-full bg-white border-b">
        <div class="mx-auto flex h-16 max-w-7xl items-center gap-8 px-4">
            <a href="{% url 'feed' %}" class="font-medium text-xl">MaKaGram</a>
            <nav class="items-center flex gap-4">
                <a class="text-sm font-medium text-gray-600 transition-colors hover:text-gray-900" href="{% url 'room-index' %}">Lobbies</a>
                <a class="text-sm font-medium text-gray-600 transition-colors hover:text-gray-900" href="{% url 'chats-list' %}">Chats</a>
                <a class="text-sm font-medium text-gray-600 transition-colors hover:text-gray-900" href="{% url 'channels-list' %}">Channels</a>
            </nav>
            <div class="flex flex-1 items-center justify-end gap-3">
                {% if request.user.is_authenticated %}
                <div class="relative">
                    <button id="notif-btn" type="button" class="relative p-2 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-full focus:outline-none transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                        </svg>
                        <span id="notif-badge" class="hidden absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full ring-2 ring-white"></span>
                    </button>

                    <div id="notif-dropdown" class="hidden absolute right-0 mt-2 w-80 bg-white rounded-xl shadow-lg border py-2 z-50">
                        <div class="px-4 py-2 border-b flex items-center justify-between">
                            <span class="font-semibold text-sm text-gray-800">Notifications</span>
                            <button id="notif-read-all" class="text-xs text-blue-600 hover:underline">Mark all as read</button>
                        </div>
                        <div id="notif-list" class="max-h-80 overflow-y-auto divide-y">
                            <div class="px-4 py-3 text-sm text-gray-400 text-center">Loading...</div>
                        </div>
                    </div>
                </div>

                <div class="relative">
                    <button id="profile-btn" class="w-9 h-9 rounded-full overflow-hidden flex items-center justify-center text-sm font-semibold text-white focus:outline-none {% if not request.user.profile.avatar_data %}bg-{{ request.user.profile.color }}-300{% endif %}">
                        {% if request.user.profile.avatar_data %}
                        <img src="{% url 'avatar' request.user.id %}" class="w-full h-full object-cover">
                        {% else %}
                        {{ request.user.profile.username|default:request.user.username|slice:":1"|upper }}
                        {% endif %}
                    </button>
                    <div id="profile-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border py-2 z-50">
                        <div class="px-4 py-2 text-sm font-medium text-{{ request.user.profile.color }}-600 border-b">
                            {{ request.user.profile.username|default:request.user.username }}
                        </div>
                        <a href="{% url 'profile' %}" class="block px-4 py-2 text-sm text-gray-500 hover:bg-gray-50">Profile</a>
                        <form method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="w-full text-left px-4 py-2 text-sm text-red-500 hover:bg-gray-50">Exit</button>
                        </form>
                    </div>
                </div>
                {% else %}
                <a href="{% url 'login' %}" class="bg-blue-500 hover:bg-blue-600 text-white text-sm px-4 py-2 rounded-md">Sign in</a>
                {% endif %}
            </div>
        </div>
    </header>
    <div class="container mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </div>
    <script>
        const btn = document.getElementById('profile-btn');
        const dropdown = document.getElementById('profile-dropdown');
        if (btn && dropdown) {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (notifDropdown) notifDropdown.classList.add('hidden');
                dropdown.classList.toggle('hidden');
            });
        }

        const notifBtn = document.getElementById('notif-btn');
        const notifDropdown = document.getElementById('notif-dropdown');
        const notifBadge = document.getElementById('notif-badge');
        const notifList = document.getElementById('notif-list');
        const notifReadAll = document.getElementById('notif-read-all');

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function autolinkNotif(text) {
            if (!text) return '';
            const escaped = escapeHtml(text);
            const urlPattern = /((?:https?:\/\/|www\.|(?:[a-zA-Z0-9-]+\.)+(?:com|org|net|io|dev|app|co|ai|ru|uk|de|fr|me|tv|gg|ly|sh|to|cloud|online|site|store|tech|info|biz|xyz))(?:\/[^\s<]*)?)([.,\)!?;:]?(?:\s|<|$))/gi;
            return escaped.replace(urlPattern, (match, url, trailing) => {
                const href = /^https?:\/\//i.test(url) ? url : `https://${url}`;
                return `<a href="${href}" target="_blank" rel="noopener noreferrer" class="text-blue-600 underline hover:text-blue-800 break-all" onclick="event.stopPropagation();">${url}</a>${trailing}`;
            });
        }

        function markNotifRead(id, link, event) {
            if (event.target.tagName === 'A') return;
            fetch(`/api/notifications/${id}/read/`, {
                method: 'POST',
                headers: { 'X-CSRFToken': '{{ csrf_token }}' }
            }).finally(() => { window.location.href = link; });
        }

        function fetchNotifications() {
            if (!notifBtn) return;
            fetch('{% url "notifications-list" %}')
                .then(r => r.json())
                .then(data => {
                    if (!data.ok) return;
                    if (data.unread_count > 0) {
                        notifBadge.classList.remove('hidden');
                    } else {
                        notifBadge.classList.add('hidden');
                    }

                    if (data.notifications.length === 0) {
                        notifList.innerHTML = '<div class="px-4 py-4 text-xs text-gray-400 text-center">No new notifications</div>';
                        return;
                    }

                    notifList.innerHTML = data.notifications.map(n => `
                        <div onclick="markNotifRead(${n.id}, '${n.link || '#'}', event)" class="block px-4 py-3 hover:bg-gray-50 transition-colors cursor-pointer ${n.is_read ? 'opacity-70' : 'bg-blue-50/40'}" data-notif-id="${n.id}">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-xs font-semibold text-gray-800">${escapeHtml(n.title)}</span>
                                <span class="text-[10px] text-gray-400">${n.created_at}</span>
                            </div>
                            <div class="text-xs text-gray-600 line-clamp-3 leading-snug">${autolinkNotif(n.message)}</div>
                        </div>
                    `).join('');
                })
                .catch(e => console.error('Notifications fetch error:', e));
        }

        if (notifBtn && notifDropdown) {
            notifBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (dropdown) dropdown.classList.add('hidden');
                notifDropdown.classList.toggle('hidden');
                if (!notifDropdown.classList.contains('hidden')) {
                    fetchNotifications();
                }
            });

            if (notifReadAll) {
                notifReadAll.addEventListener('click', (e) => {
                    e.stopPropagation();
                    fetch('{% url "notifications-mark-read" %}', {
                        method: 'POST',
                        headers: { 'X-CSRFToken': '{{ csrf_token }}' }
                    })
                    .then(r => r.json())
                    .then(data => {
                        if (data.ok) {
                            notifBadge.classList.add('hidden');
                            fetchNotifications();
                        }
                    });
                });
            }

            fetchNotifications();
            setInterval(fetchNotifications, 15000);
        }

        document.addEventListener('click', () => {
            if (dropdown) dropdown.classList.add('hidden');
            if (notifDropdown) notifDropdown.classList.add('hidden');
        });
    </script>
</body>
</html>
