<span class="username-wrapper inline-flex items-center gap-1 min-w-0">
  <span class="font-semibold text-{{ color }}-600 truncate">
    {{ username }}
  </span>

  {% if suffix %}
  <span
    class="text-xs {% if suffix_color == 'amber' %}text-amber-500{% else %}text-gray-400{% endif %} font-medium whitespace-nowrap"
  >
    [{{ suffix }}]
  </span>
  {% endif %}
</span>
